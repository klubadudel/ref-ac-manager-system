<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create New User</title>
  <link rel="stylesheet" href="../assets/css/styles.css">
  <script type="module" src="../assets/js/firebase_config.js"></script>
  <script type="module" src="../assets/js/create_user.js" defer></script>
</head>
<body>
  <div class="header">
    <h1>Head Office - Create New User</h1>
  </div>

  <div class="create-user-container">
    <form id="createUserForm" class="create-user-form">
      <h2>Create User</h2>

      <div class="form-group">
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" placeholder="Full Name" required>
      </div>

      <div class="form-group">
        <label for="newUserEmail">Email</label>
        <input type="email" id="newUserEmail" placeholder="Email" required>
      </div>

      <div class="form-group">
        <label for="newUserPassword">Password</label>
        <input type="password" id="newUserPassword" placeholder="Password" required>
      </div>

      <div class="form-group">
        <label for="userRole">Role</label>
        <select id="userRole" required>
          <option value="" disabled selected>Select Role</option>
          <option value="branch">Branch Manager</option>
          <option value="regional">Regional Manager</option>
          <option value="head_office">Head Office</option>
        </select>
      </div>

      <div class="form-group" id="permissionsGroup" style="display: none;">
        <label for="permissions">Permissions</label>
        <select id="permissions">
          <option value="view">View</option>
          <option value="edit">Edit</option>
        </select>
      </div>

      <div class="form-group" id="branchGroup" style="display: none;">
        <label for="userBranch">Branch</label>
        <select id="userBranch">
          <!-- This will be dynamically populated based on the role -->
        </select>
      </div>

      <button type="submit">Create Account</button>
    </form>
  </div>
</body>
</html>
