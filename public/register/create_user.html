<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create New User</title>
  <link rel="stylesheet" href="../assets/css/styles.css">
  <script type="module" src="../assets/js/firebase_config.js"></script>
  <script type="module" src="../assets/js/create_user.js" defer></script>
  <script type="module" src="../assets/js/dashboard.js" defer></script>
</head>
<body>
    <header class="dashboard-header">
        <div class="header-content">
            <div class="logo-container">
                <img src="../assets/images/711-logo.png" alt="7-11 Logo" class="logo">
                <h1>Head Office Dashboard</h1>
            </div>
            <div class="user-info">
                <div class="user-details">
                    <span class="user-name">Welcome, HQ</span>
                    <span class="current-branch">7-11 Philippines</span>
                </div>
                <button class="createButton" id="createButton" onclick="window.location.href='../register/create_user.html'">Create User</button>
                <button class="createBranchButton" id="createbBranchButton" onclick="window.location.href='../register/create_branch.html'">Create Branch</button>
                <button class="logoutButton" id="logoutButton">Logout</button>
            </div>
        </div>
    </header>
    <div class="create-user-container">
        <form id="createUserForm" class="create-user-form">
        <h2>Create User</h2>

        <div class="form-group">
            <label for="fullName">Full Name</label>
            <input type="text" id="fullName" placeholder="Full Name" required>
        </div>

        <div class="form-group">
            <label for="newUserEmail">Email</label>
            <input type="email" id="newUserEmail" placeholder="Email" required>
        </div>

        <div class="form-group">
            <label for="newUserPassword">Password</label>
            <input type="password" id="newUserPassword" placeholder="Password" required>
        </div>

        <div class="form-group">
            <label for="userRole">Role</label>
            <select id="userRole" required>
            <option value="" disabled selected>Select Role</option>
            <option value="branch">Branch Manager</option>
            <option value="regional">Regional Manager</option>
            <option value="head_office">Head Office</option>
            </select>
        </div>

        <div class="form-group" id="permissionsGroup" style="display: none;">
            <label>Permissions</label>
            <div id="permissionsContainer">
              <label><input type="checkbox" value="view"> View</label>
              <label><input type="checkbox" value="edit"> Edit</label>
            </div>
          </div>

        <div class="form-group" id="branchGroup" style="display: none;">
            <label for="userBranch">Branch</label>
            <select id="userBranch">
            <!-- This will be dynamically populated based on the role -->
            </select>
        </div>

        <button type="submit">Create Account</button>
        </form>
    </div>
</body>
</html>
