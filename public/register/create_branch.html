<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create New Branch</title>
  <link rel="stylesheet" href="../assets/css/styles.css">
  <script type="module" src="../assets/js/firebase_config.js"></script>
  <script type="module" src="../assets/js/create_branch.js" defer></script>
  <script type="module" src="../assets/js/dashboard.js" defer></script>
</head>
<body>
    <header class="dashboard-header">
        <div class="header-content">
            <div class="logo-container">
                <img src="../assets/images/711-logo.png" alt="7-11 Logo" class="logo">
                <h1>Head Office Dashboard</h1>
            </div>
            <div class="user-info">
                <div class="user-details">
                    <span class="user-name">Welcome, HQ</span>
                    <span class="current-branch">7-11 Philippines</span>
                </div>
                <button class="createButton" id="createButton" onclick="window.location.href='../register/create_user.html'">Create User</button>
                <button class="createBranchButton" id="createBranchButton" onclick="window.location.href='../register/create_branch.html'">Create Branch</button>
                <button class="logoutButton" id="logoutButton">Logout</button>
            </div>
        </div>
    </header>

    <div class="create-branch-container">
        <form id="createBranchForm" class="create-branch-form">
        <h2>Create New Branch</h2>

        <div class="form-group">
            <label for="branchName">Branch Name</label>
            <input type="text" id="branchName" placeholder="Branch Name" required>
        </div>

        <div class="form-group">
            <label for="address">Address</label>
            <input type="text" id="branchAddress" placeholder="Address" required>
        </div>

        <div class="form-group">
            <label for="region">Region</label>
            <select id="region">
                <!-- Options will be populated here dynamically -->
              </select>
        </div>

        <div class="form-group">
            <label for="branchUsers">Assign User</label>
            <select id="users-container">
                <!-- Dynamically added users will appear here -->
            </select>

        </div>

        <button type="submit" id="createBranchButton">Create Branch</button>
        </form>
    </div>

</body>
</html>
